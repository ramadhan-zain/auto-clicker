name: Release

# Push a tag like v0.1.0 to build AutoClick.app and publish it as a GitHub
# release. Run it by hand from the Actions tab to build without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15 # Apple Silicon, matches target_arch in AutoClick.spec
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi

      - name: Lint and test
        run: make check

      - name: Build app
        run: make build

      - uses: actions/upload-artifact@v4
        with:
          name: AutoClick-macos-arm64
          path: dist/AutoClick-macos-arm64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/AutoClick-macos-arm64.zip \
            --title "AutoClick $GITHUB_REF_NAME" \
            --generate-notes
